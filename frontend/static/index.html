<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-name" content="Documentation Assistant" />
  <title>Documentation Assistant</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <span class="app-name">Documentation Assistant</span>
      <div class="status-wrapper">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">Connecting…</span>
      </div>
    </div>
  </header>

  <main class="chat-container">
    <div class="messages" id="messages"></div>

    <div class="typing-indicator hidden" id="typingIndicator">
      <div class="typing-avatar">AI</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="questionInput"
        class="question-input"
        placeholder="Ask a question…"
        autocomplete="off"
      />
      <button type="submit" class="send-btn" id="sendBtn">Send</button>
    </form>
  </main>

  <script src="/js/chat.js"></script>
</body>
</html>
